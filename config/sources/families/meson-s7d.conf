# Track A — Amlogic S7D (S905X5M) BSP family configuration
#
# This family targets the ODROID-C5 and related S7D devices using the Amlogic GKI Linux 6.6
# BSP kernel from DannieDarko/odroid-c5_linux_common_drivers (mirror of Amlogic/Hardkernel BSP).
#
# BSP approach: Uses vendor DTS + kernel drivers for full hardware support (MMC, USB, HDMI, etc).
# Minimal patching required; inherits Amlogic infrastructure from meson64_common.inc.
#
# CRITICAL: Before first build:
#   1. Verify vendor-baseline (Phase 0): capture DTB filename, U-Boot version, bootloader sector offset
#   2. Test U-Boot standalone (Phase 1): confirm odroidc5-v2023.01 branch builds + flashes correctly
#   3. Extract full .config from successful first build with KERNEL_CONFIGURE=yes
#

source "${BASH_SOURCE%/*}/include/meson64_common.inc"

ARCH=arm64

# Kernel: Amlogic GKI Linux 6.6 BSP via DannieDarko mirror (includes ODROID-C5 DTS + drivers)
KERNEL_MAJOR_MINOR="6.6"
KERNELSOURCE="https://github.com/DannieDarko/odroid-c5_linux_common_drivers.git"
# KERNELBRANCH will be set per-branch below. Confirm main branch pin to specific commit after vendor-baseline capture.
KERNELPATCHDIR="archive/meson-s7d-6.6"

# U-Boot: Hardkernel ODROID-C5 BSP (based on U-Boot v2023.01)
BOOTSOURCE="https://github.com/hardkernel/u-boot.git"
BOOTBRANCH="branch:odroidc5-v2023.01"
BOOTPATCHDIR="v2023.01/odroidc5"

case $BRANCH in
    current)
        KERNELBRANCH="<TBD:vendor-baseline pin DannieDarko main branch to specific commit hash after first successful build. Check: git log --oneline -5 at point of C5 DTS addition>"
        ;;
esac
