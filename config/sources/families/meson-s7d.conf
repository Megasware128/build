# Track A — Amlogic S7D (S905X5M) BSP family configuration
#
# This family targets the ODROID-C5 and related S7D devices using the Amlogic Linux 5.15
# BSP kernel from DannieDarko/odroid-c5_linux (full kernel tree; common_drivers/media_modules
# are git submodules that we init in a hook below).
#
# BSP approach: Uses vendor DTS + kernel drivers for full hardware support (MMC, USB, HDMI, etc).
# Minimal patching required; inherits Amlogic infrastructure from meson64_common.inc.
#
# CRITICAL: Before first build:
#   1. Verify vendor-baseline (Phase 0): capture DTB filename, U-Boot version, bootloader sector offset
#   2. Test U-Boot standalone (Phase 1): confirm odroidc5-v2023.01 branch builds + flashes correctly
#   3. Extract full .config from successful first build with KERNEL_CONFIGURE=yes
#

source "${BASH_SOURCE%/*}/include/meson64_common.inc"

ARCH=arm64

# Kernel: Amlogic Linux 5.15 BSP — full tree at DannieDarko/odroid-c5_linux (branch: main)
# Top-level Makefile present; common_drivers + media_modules vendored via git submodules.
KERNEL_MAJOR_MINOR="5.15"
KERNELSOURCE="https://github.com/DannieDarko/odroid-c5_linux.git"
KERNELPATCHDIR="archive/meson-s7d-5.15"
KERNEL_EXTRA_CFLAGS="${KERNEL_EXTRA_CFLAGS:-} -Wno-error=frame-larger-than= -Wno-error=unused-function"

# U-Boot: Hardkernel ODROID-C5 BSP (based on U-Boot v2023.01)
BOOTSOURCE="https://git.odroid.com/yocto/uboot"
BOOTBRANCH="branch:odroidc5-v2023.01"
BOOTPATCHDIR="v2023.01/odroidc5"
UBOOT_TARGET_MAP="u-boot-dtb.img;;build/u-boot.bin:u-boot.bin build/u-boot-dtb.img:u-boot-dtb.img"

case $BRANCH in
    current)
        # DannieDarko/odroid-c5_linux main — track tip until first successful build, then pin.
        KERNELBRANCH="branch:main"
        ;;
esac

# Amlogic BSP layout requires common_drivers + media_modules submodules to be present
# in the kernel source tree before make. Armbian's fetch_from_repo does not init submodules,
# so we add a post-fetch hook that runs after the kernel checkout completes.
function fetch_sources_tools__odroidc5_init_kernel_submodules() {
    [[ "${KERNELSOURCE:-}" != *odroid-c5_linux* ]] && return 0
    local kdir="${SRC}/cache/sources/${LINUXSOURCEDIR}"
    [[ -d "${kdir}/.git" ]] || return 0
    display_alert "Initialising ODROID-C5 kernel submodules" "common_drivers media_modules" "info"
    (
        cd "${kdir}" || exit 1
        git submodule sync --recursive
        git submodule update --init --recursive --depth=1
    )
}
