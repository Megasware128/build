# Track C — Amlogic S7D (S905X5M) on Armbian distro kernel
#
# Inherits Armbian's standard meson64 kernel flow (linux-stable.git, KERNELPATCHDIR=archive/meson64-MAJOR.MINOR
# resolved per BRANCH by meson64_common.inc) and only overrides U-Boot to Hardkernel's tree,
# since S905X5M has no working mainline U-Boot port yet.
#
# Board DTS lives as a bare file at patch/kernel/archive/meson64-6.18/dt/amlogic-s7d-s905x5m-odroidc5.dts
# and is auto-included in the kernel Makefile per 0000.patching_config.yaml in that patchdir.
#
# Phase 1 caveat: upstream Linux v6.18 amlogic-s7d.dtsi has only CPUs/GIC/PSCI/pinctrl/pwrc/UART.
# No MMC/Ethernet/USB/HDMI nodes or drivers — this image only reaches UART early-boot.
# Phase 2 work (clock controller, pinctrl driver-match, ethmac, MMC DTS) is required to
# produce a rootfs-bootable image. See plan.md.

# shellcheck source=config/sources/families/include/meson64_common.inc
source "${BASH_SOURCE%/*}/include/meson64_common.inc"

ARCH=arm64
declare -g EXTRAWIFI="no"

# U-Boot: Hardkernel ODROID-C5 BSP (same as Tracks A/B — only working bootstrap for S905X5M).
# Overrides meson64_common.inc's default mainline u-boot.git tag:v2022.07 which lacks S7D support.
BOOTSOURCE="https://git.odroid.com/yocto/uboot"
BOOTBRANCH="branch:odroidc5-v2023.01"
BOOTPATCHDIR="v2023.01/odroidc5"
UBOOT_TARGET_MAP="u-boot-dtb.img;;build/u-boot.bin:u-boot.bin build/u-boot-dtb.img:u-boot-dtb.img"
