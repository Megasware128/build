# Amlogic S7D (S905X5M) — Track B mainline kernel experiment
# ODROID-C5 mainline support (limited peripheral set, upstream kernel submission target)
#
# STATUS: experimental / WIP — mainline kernel has only SoC stub (.dtsi),
# no working MMC/eMMC, USB, Ethernet, HDMI drivers yet. Use Track A (BSP)
# for production Armbian images with full hardware support.
#
# Mainline kernel is a parallel bring-up effort intended for long-term
# sustainability and upstream contribution. DTS and driver patches ported
# from vendor BSP, submitted to linux-amlogic@lists.infradead.org.

source "${BASH_SOURCE%/*}/include/meson64_common.inc"

ARCH=arm64
KERNEL_MAJOR_MINOR="6.16"
KERNELSOURCE='https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git'
KERNELBRANCH='tag:v6.16'  # <TBD:verify latest mainline tag available at build time>
KERNELPATCHDIR='archive/meson-s7d-mainline'

# U-Boot shared with Track A — Hardkernel maintains the only S905X5M bootstrap
BOOTSOURCE='https://github.com/hardkernel/u-boot.git'
BOOTBRANCH='branch:odroidc5-v2023.01'
BOOTPATCHDIR='v2023.01/odroidc5'

case $BRANCH in
    current) KERNELBRANCH='tag:v6.16' ;;
esac
